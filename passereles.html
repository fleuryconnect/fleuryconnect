<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Trouvé !</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1E1E1E;
            overflow: hidden;
        }

        .troll-container {
            text-align: center;
            width: 100%; /* Prend toute la largeur disponible */
        }

        .troll-container img {
            /* MODIFICATIONS ICI */
            width: 80%;       /* L'image prendra 80% de la largeur de la fenêtre */
            max-width: 500px; /* Limite la taille sur les très grands écrans */
            height: auto;
        }

        .back-link {
            position: absolute;
            bottom: 20px;
            color: #555;
            text-decoration: none;
            font-family: sans-serif;
            font-size: 0.8rem;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #2ecc71;
        }
    </style>
</head>
<body>

    <div class="troll-container">
        <img src="comp/Capture d_écran 2026-02-01 134027.png" alt="Troll Face">
